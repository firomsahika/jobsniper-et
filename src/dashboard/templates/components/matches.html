<!-- ============================================================== -->
<!-- COMPONENT: AI Matches & Sniper Alerts (matches.html)            -->
<!-- ============================================================== -->
<div class="space-y-6 animate-fade-in">
  <!-- Page Header -->
  <div class="flex items-start justify-between">
    <div class="flex items-start gap-3.5">
      <div class="w-10 h-10 rounded-xl bg-stone-100 border border-stone-200 flex items-center justify-center shrink-0 mt-0.5">
        <i data-lucide="crosshair" class="w-5 h-5 text-stone-700"></i>
      </div>
      <div>
        <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">AI Matches & Dispatched Alerts</h1>
        <p class="text-sm text-gray-500 mt-0.5">Two-Stage Hybrid Match Telemetry: ANN Vector Pre-filter (<20ms) + Gemini LLM Precision Constraints</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs font-semibold px-3 py-1.5 bg-purple-50 text-purple-700 border border-purple-200 rounded-xl shadow-sm flex items-center gap-1.5">
        <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
        Precision Guard &gt;= 80%
      </span>
    </div>
  </div>

  <!-- Filter Tabs -->
  <div class="flex items-center gap-2 select-none">
    <button onclick="filterMatches('all')" id="match-tab-all" class="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-gray-900 text-white flex items-center gap-1.5 transition">
      <span>All Matches</span>
      <span id="match-count-all" class="bg-white text-gray-900 font-bold px-1.5 py-0.2 rounded-full text-[10px]">--</span>
    </button>

    <button onclick="filterMatches('high')" id="match-tab-high" class="px-3.5 py-1.5 rounded-full text-xs font-medium text-gray-600 hover:bg-gray-100 flex items-center gap-1.5 transition">
      <span>High Fit (&gt;= 85%)</span>
      <span id="match-count-high" class="bg-gray-200 text-gray-600 font-bold px-1.5 py-0.2 rounded-full text-[10px]">--</span>
    </button>

    <button onclick="filterMatches('applied')" id="match-tab-applied" class="px-3.5 py-1.5 rounded-full text-xs font-medium text-gray-600 hover:bg-gray-100 flex items-center gap-1.5 transition">
      <span>Candidate Applied</span>
      <span id="match-count-applied" class="bg-gray-200 text-gray-600 font-bold px-1.5 py-0.2 rounded-full text-[10px]">--</span>
    </button>
  </div>

  <!-- Matches Container -->
  <div id="matches-container" class="space-y-4">
    <div class="text-center py-12 text-gray-400">Loading AI matches...</div>
  </div>
</div>
