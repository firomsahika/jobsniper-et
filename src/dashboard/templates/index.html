<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobSniper ET — Control Center & Telemetry</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8f9fa;
    }
    .sidebar-active {
      background-color: #f1f0eb !important;
      color: #1a1a1a !important;
      font-weight: 600;
    }
    .sidebar-active i {
      color: #1a1a1a !important;
    }
    .badge-purple {
      background-color: #f5f3ff;
      color: #6d28d9;
      border: 1px solid #ddd6fe;
    }
    .badge-green {
      background-color: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }
    .badge-blue {
      background-color: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
    }
    .badge-amber {
      background-color: #fffbeb;
      color: #d97706;
      border: 1px solid #fde68a;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.15s ease-out forwards;
    }
  </style>
</head>
<body class="flex h-screen overflow-hidden text-gray-800">

  <!-- ============================================================== -->
  <!-- LEFT SIDEBAR                                                   -->
  <!-- ============================================================== -->
  <aside class="w-64 bg-white border-r border-gray-200/80 flex flex-col justify-between shrink-0 select-none">
    <div>
      <!-- Brand Header -->
      <div class="h-16 flex items-center justify-between px-6 border-b border-gray-100">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-black text-white flex items-center justify-center font-bold text-sm tracking-tighter">
            JS
          </div>
          <div>
            <div class="font-extrabold text-sm tracking-tight leading-none text-gray-900">JobSniper ET</div>
            <div class="text-[10px] text-gray-400 font-medium tracking-tight">AI Career Radar</div>
          </div>
        </div>
        <button class="text-gray-400 hover:text-gray-600 transition p-1 rounded-md hover:bg-gray-100">
          <i data-lucide="panel-left-close" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Modular Navigation Links -->
      <nav class="p-4 space-y-1">
        <a href="#overview" onclick="switchTab('overview')" id="nav-overview" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100/70 transition">
          <i data-lucide="layout-grid" class="w-4 h-4 text-gray-500"></i>
          <span>Dashboard</span>
        </a>

        <a href="#candidates" onclick="switchTab('candidates')" id="nav-candidates" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100/70 transition">
          <i data-lucide="users" class="w-4 h-4 text-gray-500"></i>
          <span>Profile & Users</span>
        </a>

        <a href="#applications" onclick="switchTab('applications')" id="nav-applications" class="sidebar-active flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition">
          <i data-lucide="briefcase" class="w-4 h-4 text-gray-700"></i>
          <span>Applications</span>
        </a>

        <a href="#matches" onclick="switchTab('matches')" id="nav-matches" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100/70 transition">
          <i data-lucide="crosshair" class="w-4 h-4 text-gray-500"></i>
          <span>AI Matches & Alerts</span>
        </a>

        <a href="#interviews" onclick="switchTab('interviews')" id="nav-interviews" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100/70 transition">
          <i data-lucide="mic" class="w-4 h-4 text-gray-500"></i>
          <span>Mock Interviews</span>
        </a>

        <a href="#channels" onclick="switchTab('channels')" id="nav-channels" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100/70 transition">
          <i data-lucide="radio" class="w-4 h-4 text-gray-500"></i>
          <span>Monitored Channels (31)</span>
        </a>

        <a href="#finance" onclick="switchTab('finance')" id="nav-finance" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100/70 transition">
          <i data-lucide="wallet" class="w-4 h-4 text-gray-500"></i>
          <span>Finance & Pro</span>
        </a>
      </nav>
    </div>

    <!-- User Profile Pill at Bottom of Sidebar (Matching User's Uploaded Screenshot) -->
    <div class="p-4 border-t border-gray-100">
      <div class="flex items-center justify-between p-2 rounded-xl hover:bg-gray-100/80 cursor-pointer transition">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-black text-white font-bold text-xs flex items-center justify-center tracking-wider">
            FH
          </div>
          <div class="overflow-hidden">
            <div class="text-xs font-semibold text-gray-900 truncate">Firomsa Hika</div>
            <div class="text-[11px] text-gray-400 truncate">firomsahika2022@gmail.com</div>
          </div>
        </div>
        <i data-lucide="chevrons-up-down" class="w-3.5 h-3.5 text-gray-400 shrink-0"></i>
      </div>
    </div>
  </aside>

  <!-- ============================================================== -->
  <!-- MAIN CONTENT AREA                                              -->
  <!-- ============================================================== -->
  <main class="flex-1 flex flex-col overflow-y-auto">

    <!-- Top Sticky Header Bar -->
    <header class="h-16 bg-white/70 backdrop-blur-md border-b border-gray-200/70 flex items-center justify-between px-8 shrink-0 sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <span class="text-xs font-semibold px-2.5 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200/80 rounded-full flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          Ingestion Active (31 Channels)
        </span>
        <span class="text-xs text-gray-400 font-medium">Free Tier Guard: <b class="text-gray-700">14 RPM Max</b></span>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="refreshCurrentView()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-gray-600 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-lg transition">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          <span>Live Refresh</span>
        </button>
        <a href="https://t.me/JobSniperET_bot" target="_blank" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-white bg-black hover:bg-gray-800 rounded-lg transition shadow-sm">
          <i data-lucide="send" class="w-3.5 h-3.5"></i>
          <span>Open Bot</span>
        </a>
      </div>
    </header>

    <!-- Component Mount Container -->
    <div class="p-8 max-w-6xl mx-auto w-full">
      <div id="main-view-container">
        <!-- Modular component HTML gets dynamically loaded here -->
        <div class="text-center py-20 text-gray-400">Loading component...</div>
      </div>
    </div>
  </main>

  <!-- ============================================================== -->
  <!-- COMPONENT ROUTER & PERSPECTIVE CONTROLLERS                     -->
  <!-- ============================================================== -->
  <script>
    const componentCache = {};
    let currentTab = 'applications';
    let currentApplicationFilter = 'all';
    let currentCandidateFilter = 'all';
    let currentMatchFilter = 'all';
    let currentInterviewFilter = 'all';
    let currentChannelFilter = 'all';

    // In-memory data stores for active components
    let applicationsData = [];
    let candidatesData = [];
    let matchesData = [];
    let interviewsData = [];
    let channelsData = [];
    let analyticsData = {};

    document.addEventListener("DOMContentLoaded", () => {
      // Determine initial tab from URL hash or default to 'applications' (matches screenshot)
      const hash = window.location.hash.replace('#', '');
      const validTabs = ['overview', 'candidates', 'applications', 'matches', 'interviews', 'channels', 'finance'];
      const initialTab = validTabs.includes(hash) ? hash : 'applications';
      
      switchTab(initialTab);
    });

    // -------------------------------------------------------------
    // Core Component Switcher
    // -------------------------------------------------------------
    async function switchTab(tab) {
      currentTab = tab;
      window.location.hash = tab;

      // 1. Update sidebar active state
      document.querySelectorAll('aside nav a').forEach(a => {
        a.classList.remove('sidebar-active');
        a.classList.add('text-gray-600');
      });
      const activeLink = document.getElementById(`nav-${tab}`);
      if (activeLink) {
        activeLink.classList.add('sidebar-active');
        activeLink.classList.remove('text-gray-600');
      }

      // 2. Fetch and render modular component template
      const container = document.getElementById('main-view-container');
      try {
        if (!componentCache[tab]) {
          const res = await fetch(`/components/${tab}.html`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          componentCache[tab] = await res.text();
        }

        container.innerHTML = componentCache[tab];
        lucide.createIcons();

        // 3. Initialize perspective view data
        initPerspectiveView(tab);
      } catch (err) {
        console.error(`Failed to load component ${tab}:`, err);
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 border border-red-200 text-center">
            <i data-lucide="alert-circle" class="w-8 h-8 text-red-500 mx-auto mb-2"></i>
            <h3 class="text-base font-bold text-gray-900">Failed to load view</h3>
            <p class="text-xs text-gray-500 mt-1">${err.message}</p>
          </div>
        `;
        lucide.createIcons();
      }
    }

    function initPerspectiveView(tab) {
      if (tab === 'overview') {
        loadOverviewView();
      } else if (tab === 'applications') {
        loadApplicationsView();
      } else if (tab === 'candidates') {
        loadCandidatesView();
      } else if (tab === 'matches') {
        loadMatchesView();
      } else if (tab === 'interviews') {
        loadInterviewsView();
      } else if (tab === 'channels') {
        loadChannelsView();
      } else if (tab === 'finance') {
        lucide.createIcons();
      }
    }

    function refreshCurrentView() {
      // Bust cache for active tab and reload
      delete componentCache[currentTab];
      switchTab(currentTab);
    }

    // -------------------------------------------------------------
    // Perspective: 1. Overview Component
    // -------------------------------------------------------------
    async function loadOverviewView() {
      try {
        const res = await fetch('/api/analytics');
        analyticsData = await res.json();

        const candEl = document.getElementById('stat-candidates');
        const jobsEl = document.getElementById('stat-jobs');
        const matchEl = document.getElementById('stat-matches');
        const intEl = document.getElementById('stat-interviews');
        const scoreEl = document.getElementById('stat-avg-score');

        if (candEl) candEl.innerText = analyticsData.candidates?.total || 0;
        if (jobsEl) jobsEl.innerText = analyticsData.jobs?.total || 0;
        if (matchEl) matchEl.innerText = analyticsData.matches?.total || 0;
        if (intEl) intEl.innerText = analyticsData.interviews?.total || 0;
        if (scoreEl && analyticsData.interviews?.average_score > 0) {
          scoreEl.innerText = `Avg Score: ${analyticsData.interviews.average_score}/10`;
        }

        // Funnel updates
        const totalJobs = Math.max(1, analyticsData.jobs?.total || 0);
        const totalMatches = analyticsData.matches?.total || 0;
        const applied = analyticsData.matches?.applied || 0;

        const s1 = document.getElementById('funnel-stage1');
        const s2 = document.getElementById('funnel-stage2');
        const conv = document.getElementById('funnel-conversion');
        if (s1) s1.innerText = `${Math.min(100, Math.round((totalMatches * 2 / totalJobs) * 100))}% Pre-filtered`;
        if (s2) s2.innerText = `${totalMatches} Qualified Matches`;
        if (conv) conv.innerText = `${analyticsData.matches?.conversion_rate || 0}% Conversion`;

        lucide.createIcons();
      } catch (e) {
        console.warn('Error loading overview:', e);
      }
    }

    // -------------------------------------------------------------
    // Perspective: 2. Applications Component (Matching User Screenshot)
    // -------------------------------------------------------------
    async function loadApplicationsView() {
      try {
        const res = await fetch('/api/jobs?limit=50');
        const jobs = await res.json();

        if (jobs && jobs.length > 0) {
          applicationsData = jobs.map((j, idx) => ({
            id: j.id,
            title: j.title || "Software Engineer",
            company: j.company || "Ethiopian Tech",
            channel: j.source_channel || "@hahujobs",
            statusBadge: idx === 0 ? "Interview under review" : "Qualified for role",
            badgeType: idx === 0 ? "purple" : "green",
            notice: idx === 0 ? "Interview simulation active. Prepare 5 STAR questions via Telegram bot." : "All steps completed. You'll be contacted with next steps.",
            skills: j.skills || ["Python", "FastAPI", "PostgreSQL"],
            category: idx === 0 ? "active" : "completed",
            experience: j.required_experience || 2,
            deadline: j.deadline || "Open"
          }));
        } else {
          // Exact realistic fallback matching uploaded screenshot
          applicationsData = [
            {
              id: 'app-1',
              title: "React and Next.Js Engineer",
              statusBadge: "Interview under review",
              badgeType: "purple",
              notice: "Interview simulation active. Prepare 5 STAR questions via Telegram bot.",
              skills: ["React", "Next.js", "TypeScript", "Tailwind CSS"],
              category: "active",
              company: "Addis FinTech Solutions",
              channel: "@freelance_ethiopia",
              deadline: "Nov 30, 2026",
              experience: 3
            },
            {
              id: 'app-2',
              title: "Ubuntu/Linux User for AI Data Training",
              statusBadge: "Qualified for role",
              badgeType: "green",
              notice: "All steps completed. You'll be contacted with next steps.",
              skills: ["Linux", "Ubuntu", "Bash Scripting", "Data Annotation"],
              category: "completed",
              company: "Global AI Work Africa",
              channel: "@hahujobs",
              deadline: "Dec 05, 2026",
              experience: 1
            },
            {
              id: 'app-3',
              title: "Full Stack Engineer (Node.js and React)",
              statusBadge: "Qualified for role",
              badgeType: "green",
              notice: "All steps completed. You'll be contacted with next steps.",
              skills: ["Node.js", "React", "PostgreSQL", "Docker", "REST API"],
              category: "completed",
              company: "Ethio Digital Services PLC",
              channel: "@ethiojobs_et",
              deadline: "Dec 10, 2026",
              experience: 4
            }
          ];
        }

        renderApplications();
      } catch (err) {
        console.error(err);
      }
    }

    function renderApplications() {
      const container = document.getElementById('cards-container');
      if (!container) return;
      container.innerHTML = '';

      let filtered = applicationsData;
      if (currentApplicationFilter !== 'all') {
        filtered = applicationsData.filter(item => item.category === currentApplicationFilter);
      }

      // Update badge counts
      const activeCount = applicationsData.filter(d => d.category === 'active').length;
      const completedCount = applicationsData.filter(d => d.category === 'completed').length;
      const badgeAll = document.getElementById('badge-all');
      const badgeActive = document.getElementById('badge-active');
      const badgeCompleted = document.getElementById('badge-completed');

      if (badgeAll) badgeAll.innerText = applicationsData.length;
      if (badgeActive) badgeActive.innerText = activeCount;
      if (badgeCompleted) badgeCompleted.innerText = completedCount;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-12 text-center border border-gray-200/80">
            <i data-lucide="inbox" class="w-10 h-10 text-gray-300 mx-auto mb-3"></i>
            <div class="text-sm font-semibold text-gray-700">No applications in this category</div>
            <div class="text-xs text-gray-400 mt-1">Vacancies will appear here as channels publish new posts.</div>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      filtered.forEach(item => {
        const badgeClass = item.badgeType === 'purple' ? 'badge-purple' : 'badge-green';
        const cardHtml = `
          <div class="bg-white rounded-2xl border border-gray-200/80 p-5 shadow-sm hover:shadow-md transition">
            <!-- Header Row -->
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <h3 class="text-base font-bold text-gray-900 tracking-tight">${item.title}</h3>
                <span class="${badgeClass} px-2.5 py-0.5 rounded-full text-xs font-medium flex items-center gap-1">
                  ${item.badgeType === 'green' ? '<i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-600"></i>' : ''}
                  ${item.statusBadge}
                </span>
              </div>

              <div class="flex items-center gap-3">
                <button title="More Information" class="text-gray-400 hover:text-gray-600 p-1">
                  <i data-lucide="info" class="w-4 h-4"></i>
                </button>
                <button onclick="toggleDetails('${item.id}')" class="text-xs font-semibold text-gray-600 hover:text-gray-900 flex items-center gap-1 transition">
                  <span>Details</span>
                  <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>

            <!-- Notice Strip (Exact Screenshot Styling) -->
            <div class="bg-stone-50 border border-stone-200/60 text-stone-700 rounded-xl px-4 py-2.5 mt-3 text-xs flex items-center gap-2">
              <i data-lucide="check-circle" class="w-3.5 h-3.5 text-stone-500 shrink-0"></i>
              <span>${item.notice}</span>
            </div>

            <!-- Collapsible Drawer -->
            <div id="details-${item.id}" class="hidden pt-4 mt-4 border-t border-gray-100 text-xs text-gray-600 grid grid-cols-2 md:grid-cols-4 gap-4">
              <div>
                <span class="text-gray-400 block font-medium">Hiring Employer</span>
                <span class="font-semibold text-gray-800">${item.company || 'Not Specified'}</span>
              </div>
              <div>
                <span class="text-gray-400 block font-medium">Telegram Channel</span>
                <span class="font-semibold text-gray-800">${item.channel || 'Telegram'}</span>
              </div>
              <div>
                <span class="text-gray-400 block font-medium">Application Deadline</span>
                <span class="font-semibold text-gray-800">${item.deadline || 'Open'}</span>
              </div>
              <div>
                <span class="text-gray-400 block font-medium">Required Experience</span>
                <span class="font-semibold text-gray-800">${item.experience} years</span>
              </div>
              <div class="col-span-2 md:col-span-4 mt-1">
                <span class="text-gray-400 block font-medium mb-1.5">Required Skills:</span>
                <div class="flex flex-wrap gap-1.5">
                  ${(item.skills || []).map(s => `<span class="bg-gray-100 text-gray-700 px-2 py-0.5 rounded-md font-medium text-[11px]">${s}</span>`).join('')}
                </div>
              </div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHtml);
      });

      lucide.createIcons();
    }

    function toggleDetails(id) {
      const el = document.getElementById(`details-${id}`);
      if (el) el.classList.toggle('hidden');
    }

    function filterCategory(category) {
      currentApplicationFilter = category;
      const tabAll = document.getElementById('tab-all');
      const tabActive = document.getElementById('tab-active');
      const tabCompleted = document.getElementById('tab-completed');

      [tabAll, tabActive, tabCompleted].forEach(t => {
        if (t) t.className = "px-3.5 py-1.5 rounded-full text-xs font-medium text-gray-600 hover:bg-gray-100 flex items-center gap-1.5 transition";
      });

      const activeStyle = "px-3.5 py-1.5 rounded-full text-xs font-semibold bg-gray-900 text-white flex items-center gap-1.5 transition";
      if (category === 'all' && tabAll) tabAll.className = activeStyle;
      if (category === 'active' && tabActive) tabActive.className = activeStyle;
      if (category === 'completed' && tabCompleted) tabCompleted.className = activeStyle;

      renderApplications();
    }

    // -------------------------------------------------------------
    // Perspective: 3. Candidates / Users Component
    // -------------------------------------------------------------
    async function loadCandidatesView() {
      try {
        const res = await fetch('/api/candidates');
        const data = await res.json();
        
        candidatesData = (data && data.length > 0) ? data : [
          {
            id: 'cand-1',
            full_name: "Firomsa Hika",
            telegram_id: 9128522246,
            ui_language: "en",
            title: "Senior Full Stack & AI Engineer",
            experience: 4,
            skills: ["Python", "FastAPI", "React", "PostgreSQL", "Docker"],
            min_match_score: 80,
            is_active: true,
            has_cv: true,
            created_at: "2026-11-23"
          },
          {
            id: 'cand-2',
            full_name: "Alemayehu Tadesse",
            telegram_id: 847291039,
            ui_language: "am",
            title: "Project M&E Specialist",
            experience: 5,
            skills: ["Data Analysis", "SPSS", "KoboToolbox", "Report Writing"],
            min_match_score: 85,
            is_active: true,
            has_cv: true,
            created_at: "2026-11-22"
          },
          {
            id: 'cand-3',
            full_name: "Chaltu Bekele",
            telegram_id: 712938491,
            ui_language: "om",
            title: "UI/UX Product Designer",
            experience: 3,
            skills: ["Figma", "Design Systems", "Prototyping", "User Research"],
            min_match_score: 75,
            is_active: false,
            has_cv: true,
            created_at: "2026-11-20"
          }
        ];

        renderCandidates();
      } catch (e) {
        console.error("Error loading candidates:", e);
      }
    }

    function renderCandidates(filteredList = null) {
      const container = document.getElementById('candidates-container');
      if (!container) return;
      container.innerHTML = '';

      let list = filteredList || candidatesData;
      if (currentCandidateFilter === 'active') list = list.filter(c => c.is_active);
      if (currentCandidateFilter === 'paused') list = list.filter(c => !c.is_active);

      const countAll = document.getElementById('cand-count-all');
      const countActive = document.getElementById('cand-count-active');
      const countPaused = document.getElementById('cand-count-paused');
      if (countAll) countAll.innerText = candidatesData.length;
      if (countActive) countActive.innerText = candidatesData.filter(c => c.is_active).length;
      if (countPaused) countPaused.innerText = candidatesData.filter(c => !c.is_active).length;

      if (list.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-12 text-center border border-gray-200">
            <i data-lucide="users" class="w-10 h-10 text-gray-300 mx-auto mb-3"></i>
            <div class="text-sm font-semibold text-gray-700">No candidates found</div>
            <div class="text-xs text-gray-400 mt-1">Candidates who start @JobSniperET_bot will appear here automatically.</div>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      list.forEach(c => {
        const langNames = { en: "English", am: "አማርኛ (Amharic)", om: "Afaan Oromoo" };
        const langBadges = { en: "badge-blue", am: "badge-green", om: "badge-amber" };
        const initials = (c.full_name || "User").split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();

        const card = `
          <div class="bg-white rounded-2xl border border-gray-200/80 p-5 shadow-sm hover:shadow-md transition">
            <div class="flex items-center justify-between">

    function filterCandidates(cat) {
      currentCandidateFilter = cat;
      const bAll = document.getElementById('cand-tab-all');
      const bAct = document.getElementById('cand-tab-active');
      const bPau = document.getElementById('cand-tab-paused');

      [bAll, bAct, bPau].forEach(b => {
        if (b) b.className = "px-3.5 py-1.5 rounded-full text-xs font-medium text-gray-600 hover:bg-gray-100 flex items-center gap-1.5 transition";
      });

      const activeStyle = "px-3.5 py-1.5 rounded-full text-xs font-semibold bg-gray-900 text-white flex items-center gap-1.5 transition";
      if (cat === 'all' && bAll) bAll.className = activeStyle;
      if (cat === 'active' && bAct) bAct.className = activeStyle;
      if (cat === 'paused' && bPau) bPau.className = activeStyle;

      renderCandidates();
    }

    function searchCandidates(query) {
      const q = query.toLowerCase().trim();
      if (!q) {
        renderCandidates();
        return;
      }
      const filtered = candidatesData.filter(c => 
        (c.full_name && c.full_name.toLowerCase().includes(q)) ||
        (c.title && c.title.toLowerCase().includes(q)) ||
        (c.telegram_id && String(c.telegram_id).includes(q)) ||
        (c.skills && c.skills.some(s => s.toLowerCase().includes(q)))
      );
      renderCandidates(filtered);
    }

                  <span>•</span>
